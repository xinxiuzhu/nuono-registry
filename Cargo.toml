[package]
name = "nuono-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Reviewed Nuono source plugin registry and publishing tools"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "3"
hex = "0.4"
reqwest = { version = "0.13", features = ["blocking", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0
incremental = true

[profile.release]
incremental = true
strip = "debuginfo"
