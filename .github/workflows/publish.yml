name: Publish catalog
on:
  workflow_run:
    workflows: [Validate registry]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: catalog-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Build Rust registry CLI
        run: cargo build --locked
      - run: target/debug/nuono-registry build
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
      - run: target/debug/nuono-registry publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
